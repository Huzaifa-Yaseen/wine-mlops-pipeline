name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: make install

      - name: Code Quality & Linting
        run: make lint

      - name: Train Models & Register Champion
        run: |
          make train
          python3 src/evaluate.py

      - name: Execute Unit Tests & Quality Gate
        run: make test
